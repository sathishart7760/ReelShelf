name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          if [ -f ReelShelf-project.zip ]; then
            unzip -q -o ReelShelf-project.zip
            cp -r ReelShelf/. .
            rm -rf ReelShelf
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk ReelShelf.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ReelShelf-apk
          path: ReelShelf.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Reel Shelf build ${{ github.run_number }}
          files: ReelShelf.apk
